services:
  frontend:
    image: myPlanner/react:latest
    build: Frontends/React
    restart: always
    ports:
      - '8000:3000'
    expose:
      - '8000'
    environment:
      HTTPS: ${HTTPS}
      REACT_APP_API_URL: ${REACT_APP_API_URL}
      REACT_APP_CLERK_PUBLISHABLE_KEY: ${REACT_APP_CLERK_PUBLISHABLE_KEY}

  api:
    image: myPlanner/api:latest
    build: Backends/DotNet
    depends_on:
      - database
    restart: always
    ports:
      - '8080:8080'
    expose:
      - '8080'
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MYSQLCONNSTR_LOCALDB: ${MYSQLCONNSTR_LOCALDB}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LlmSettings__Model: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # The Bucket — one flat folder of stored uploads (Bill Images, Statement Files). Inside the
      # container it is always /app/storage; STORAGE_PATH only chooses the host folder, exactly like
      # DB_VOLUME_PATH does for the database. The mount is not optional: without it the writes succeed
      # and vanish on the next `docker compose up`.
      STORAGE_PATH: /app/storage
    volumes:
      - ${STORAGE_PATH:-./storage}:/app/storage

  database:
    image: mysql
    container_name: mysql
    volumes:
      - ${DB_VOLUME_PATH}:/var/lib/mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

  phpmyadmin:
    image: phpmyadmin:5.2.1-apache
    ports:
      - '8234:80'
    environment:
      PMA_HOST: database
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

volumes:
  db_data:
